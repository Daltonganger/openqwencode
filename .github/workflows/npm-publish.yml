name: Publish package to npm

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_VERSION="${RELEASE_TAG#v}"

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check npm package contents
        run: |
          npm pack --dry-run --json > npm-pack.json
          node - <<'EOF'
          const { readFileSync } = require('node:fs');

          const packResult = JSON.parse(readFileSync('npm-pack.json', 'utf8'));
          const files = new Set((packResult[0]?.files ?? []).map(file => file.path));
          const expectedFiles = new Set(['README.md', 'events.js', 'index.js', 'package.json', 'plugin.js']);

          const unexpectedFiles = [...files].filter(file => !expectedFiles.has(file));
          const missingFiles = [...expectedFiles].filter(file => !files.has(file));

          if (unexpectedFiles.length || missingFiles.length) {
            console.error('Unexpected npm package contents detected.');
            if (unexpectedFiles.length) console.error('Unexpected:', unexpectedFiles.join(', '));
            if (missingFiles.length) console.error('Missing:', missingFiles.join(', '));
            process.exit(1);
          }

          console.log('npm package contents match expected file list.');
          EOF

      - name: Dry-run npm publish
        run: npm publish --dry-run

  publish-npm:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish package to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
